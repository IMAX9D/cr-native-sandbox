name: R0 Elite offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[training,data-processing,test]"
      - run: python -m pytest tests/test_training_r0.py tests/test_training_r0_rich.py tests/test_training_r0_elite.py tests/test_r0_admission_evidence.py tests/test_r0_capture_stream_admission.py tests/test_r0_compile.py tests/test_r0_il_dataset.py tests/test_r0_resource_inheritance.py tests/test_r0_training_smoke.py tests/test_prepare_600k.py tests/test_processing_contract.py tests/test_raw_pilot_audit.py tests/test_replay_capture_repairs.py tests/test_firstlight_resolution.py -q
      - run: python -m training_r0.smoke --profile tiny --steps 8 --rich
      - run: python -m data_pipeline.r0_train --help
